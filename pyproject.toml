[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "monkeyocr"
version = "2.0.0"
description = "MonkeyOCRv2 document parsing service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "aiofiles>=24.1,<25",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pypdf>=5.7,<7",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
demo = ["gradio>=5.35,<6"]
dflash = ["vllm==0.25.1"]
inference = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11.2,<12",
    "pypdfium2>=4.30,<5",
    "requests>=2.32,<3",
    "timm>=1.0,<2",
    "tqdm>=4.67,<5",
]
research = [
    "einops>=0.8,<1",
    "huggingface-hub>=0.33,<1",
    "modelscope>=1.27,<2",
    "pillow>=11.2,<12",
    "qwen-vl-utils>=0.0.11,<1",
    "transformers>=4.51,<5",
]
standard = ["vllm==0.11.2"]
training = ["beautifulsoup4>=4.13,<5"]

[project.scripts]
monkeyocr-api = "monkeyocr.interface.cli.api:main"
monkeyocr-demo = "monkeyocr.interface.demo.gradio:main"
monkeyocr-model = "monkeyocr.interface.cli.model:main"
monkeyocr-parse = "monkeyocr.interface.cli.parse:main"
monkeyocr-understanding = "monkeyocr.interface.cli.understanding:main"
monkeyocr-vision = "monkeyocr.interface.cli.vision:main"
monkeyocr-vision-vitae = "monkeyocr.interface.cli.vision_vitae:main"
monkeyocr-vllm = "monkeyocr.interface.cli.vllm:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.16,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<0.13",
    "types-aiofiles>=24.1,<25",
    "types-requests>=2.32,<3",
]

[tool.uv]
conflicts = [
    [{ extra = "standard" }, { extra = "dflash" }],
    [{ extra = "dflash" }, { extra = "research" }],
    [{ extra = "dflash" }, { extra = "demo" }],
]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/monkeyocr"]
exclude = ["src/monkeyocr/infrastructure/training/vendor/**"]

[tool.hatch.build.targets.sdist]
exclude = ["src/monkeyocr/infrastructure/training/vendor/**"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "download_model.py",
    "parsing",
    "understanding",
    "vision",
    "src/monkeyocr/infrastructure/modeling",
    "src/monkeyocr/infrastructure/pipeline",
    "src/monkeyocr/infrastructure/training",
    "src/monkeyocr/interface/cli",
    "src/monkeyocr/interface/demo",
    "src/monkeyocr/infrastructure/training/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["monkeyocr"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/monkeyocr"]
exclude = [
    "src/monkeyocr/infrastructure/modeling/",
    "src/monkeyocr/infrastructure/pipeline/",
    "src/monkeyocr/infrastructure/training/",
    "src/monkeyocr/interface/cli/",
    "src/monkeyocr/interface/demo/",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
