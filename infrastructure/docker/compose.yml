name: ${COMPOSE_PROJECT_NAME:-monkeyocr}

x-monkeyocr-build: &monkeyocr-build
  context: .
  dockerfile: infrastructure/docker/Dockerfile
  args:
    HTTP_PROXY: ${MONKEYOCR_BUILD_PROXY:-}
    HTTPS_PROXY: ${MONKEYOCR_BUILD_PROXY:-}
    NO_PROXY: ${MONKEYOCR_BUILD_NO_PROXY:-localhost,127.0.0.1,api,vllm,web}
    UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
  extra_hosts:
    - host.docker.internal:host-gateway

x-monkeyocr-web-build: &monkeyocr-web-build
  context: .
  dockerfile: infrastructure/docker/Dockerfile.web
  args:
    HTTP_PROXY: ${MONKEYOCR_BUILD_PROXY:-}
    HTTPS_PROXY: ${MONKEYOCR_BUILD_PROXY:-}
    NO_PROXY: ${MONKEYOCR_BUILD_NO_PROXY:-localhost,127.0.0.1,api,vllm,web}
    UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
  extra_hosts:
    - host.docker.internal:host-gateway

x-monkeyocr-service: &monkeyocr-service
  restart: unless-stopped
  user: ${MONKEYOCR_UID:-1000}:${MONKEYOCR_GID:-1000}
  extra_hosts:
    - host.docker.internal:host-gateway
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=1g
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

x-monkeyocr-gpu-service: &monkeyocr-gpu-service
  <<: *monkeyocr-service
  gpus: all
  shm_size: 8gb

services:
  vllm:
    <<: *monkeyocr-gpu-service
    image: ${MONKEYOCR_VLLM_IMAGE:-monkeyocr:vllm-standard}
    build:
      <<: *monkeyocr-build
      target: vllm
    command: ["monkeyocr-vllm"]
    environment:
      HOME: /home/monkeyocr
      # PyTorch resolves a username before honoring its cache override.
      USER: monkeyocr
      # Keep generated code and import-time precompiled headers off noexec /tmp.
      TMPDIR: /home/monkeyocr
      TORCHINDUCTOR_CACHE_DIR: /home/monkeyocr/.cache/torch_inductor
    env_file:
      - ./dotenv/.env.vllm
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      # Triton compiles trusted CUDA helpers into this cache and loads them as shared objects.
      - /home/monkeyocr:rw,exec,nosuid,nodev,size=2g,uid=${MONKEYOCR_UID:-1000},gid=${MONKEYOCR_GID:-1000},mode=0700
    volumes:
      - ${MONKEYOCR_MODEL_ROOT:-./model_weight}:/models:ro
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s

  api:
    <<: *monkeyocr-gpu-service
    image: ${MONKEYOCR_API_IMAGE:-monkeyocr:api-standard}
    build:
      <<: *monkeyocr-build
      target: api
    command: ["monkeyocr-api"]
    env_file:
      - ./dotenv/.env.api
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - target: 8000
        published: "${MONKEYOCR_API_HOST_PORT:-8000}"
        host_ip: ${MONKEYOCR_API_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    volumes:
      - ${MONKEYOCR_MODEL_ROOT:-./model_weight}:/models:ro
      - ${MONKEYOCR_RESULTS_ROOT:-./output/api}:/var/lib/monkeyocr/results
    secrets:
      - source: monkeyocr_api_token
        target: monkeyocr_api_token
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/internal/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  web:
    <<: *monkeyocr-service
    image: ${MONKEYOCR_WEB_IMAGE:-monkeyocr:web}
    build: *monkeyocr-web-build
    init: true
    command: ["monkeyocr-web"]
    env_file:
      - ./dotenv/.env.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${MONKEYOCR_WEB_HOST_PORT:-8080}"
        host_ip: ${MONKEYOCR_WEB_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    volumes:
      - ${MONKEYOCR_WEB_RESULTS_ROOT:-./output/web}:/var/lib/monkeyocr-web/jobs
    secrets:
      - source: monkeyocr_api_token
        target: monkeyocr_api_token
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/internal/health/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

secrets:
  monkeyocr_api_token:
    file: ${MONKEYOCR_TOKEN_SECRET_FILE:-./dotenv/secrets/monkeyocr_api_token}
