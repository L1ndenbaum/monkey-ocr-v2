name: Publish production images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/publish-image.yml"
      - ".dockerignore"
      - "infrastructure/docker/Dockerfile"
      - "scripts/check_image_size.py"
      - "src/**"
      - "!src/monkeyocr/application/web_jobs.py"
      - "!src/monkeyocr/infrastructure/config/web_settings.py"
      - "!src/monkeyocr/infrastructure/http/**"
      - "!src/monkeyocr/infrastructure/storage/web_jobs.py"
      - "!src/monkeyocr/interface/cli/web.py"
      - "!src/monkeyocr/interface/http/internal_web/**"
      - "LICENSE"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: publish-standard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-standard:
    name: Build ${{ matrix.target }} standard image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            tag_prefix: api-standard
            title: MonkeyOCRv2 authenticated API
            description: Authenticated MonkeyOCRv2 API and preprocessing runtime
            cache_primary: monkeyocr-api-standard
            cache_secondary: monkeyocr-vllm-standard
            max_total_gib: 8
            base_reference: nvidia/cuda:12.8.1-runtime-ubuntu22.04@sha256:fcbbd60a5ad3db3a1c7375bf14546b369b54064c513224310b2026df50c7a9bd
            legacy_standard: false
          - target: vllm
            tag_prefix: vllm-standard
            title: MonkeyOCRv2 vLLM runtime
            description: MonkeyOCRv2 Standard vLLM inference runtime
            cache_primary: monkeyocr-vllm-standard
            cache_secondary: monkeyocr-api-standard
            max_total_gib: 12
            base_reference: nvidia/cuda:12.8.1-devel-ubuntu22.04@sha256:6617a625f4090c76c545a0e7d63f2e441718ef9af7f4efe7dd1242a29e289fd7
            legacy_standard: true
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          sudo docker system prune --all --force --volumes
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag_prefix }},enable={{is_default_branch}}
            type=sha,prefix=${{ matrix.tag_prefix }}-sha-,format=long
            type=semver,pattern={{version}},prefix=${{ matrix.tag_prefix }}-
            type=raw,value=standard,enable=${{ matrix.legacy_standard && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            HTTP_PROXY=
            HTTPS_PROXY=
            NO_PROXY=localhost,127.0.0.1,api,vllm
            UV_INDEX_URL=https://pypi.org/simple
          cache-from: |
            type=gha,scope=${{ matrix.cache_primary }}
            type=gha,scope=${{ matrix.cache_secondary }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_primary }},ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Enforce image size budgets
        env:
          IMAGE_REFERENCE: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}@${{ steps.build.outputs.digest }}
        run: |
          python scripts/check_image_size.py \
            "$IMAGE_REFERENCE" \
            --base-reference '${{ matrix.base_reference }}' \
            --max-total-gib '${{ matrix.max_total_gib }}'

      - name: Publish summary
        run: |
          {
            echo "### Published MonkeyOCR ${{ matrix.target }} image"
            echo '```text'
            echo '${{ steps.metadata.outputs.tags }}'
            echo '```'
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
